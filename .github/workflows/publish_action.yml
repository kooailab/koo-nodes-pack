name: Publish to Comfy Registry
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false
jobs:
  publish-node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Verify owner-supplied metadata
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          publisher = data["tool"]["comfy"]["PublisherId"]
          repository = data["project"]["urls"]["Repository"]
          assert publisher != "TODO", "Supply your actual PublisherId before publishing"
          assert repository.startswith("https://github.com/"), "Supply the actual repository URL"
          license_file = pathlib.Path("LICENSE")
          assert license_file.is_file() and "TODO" not in license_file.read_text(), "Choose and add your license before publishing"
          PY
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
