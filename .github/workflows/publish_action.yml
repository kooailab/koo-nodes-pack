name: Validate and publish to Comfy Registry
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: [pyproject.toml]
permissions:
  contents: read
concurrency:
  group: comfy-registry-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish-node:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMFYUI_ROOT: ${{ github.workspace }}/.test-comfy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out the tested ComfyUI core
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: 0f74f7fb9f83a78bf46188fd4fd53e6bc44c1ae8
          path: .test-comfy
      - name: Install CPU test dependencies and official packager
        run: |
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .test-comfy/requirements.txt -r requirements.txt comfy-cli==1.22.0
      - name: Run backend and frontend tests
        run: python scripts/run_tests.py
      - name: Validate metadata and runtime
        run: python scripts/validate_release.py
      - name: Reject version collisions (fail closed)
        if: github.event_name != 'pull_request'
        run: python scripts/validate_release.py --check-registry
      - name: Build and inspect the official archive
        env:
          COMFY_CLI_ENABLE_TELEMETRY: 'false'
        run: |
          comfy --skip-prompt --no-enable-telemetry node pack
          python scripts/validate_release.py --archive node.zip
      - name: Publish with the official Comfy CLI
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::error::Missing Actions secret REGISTRY_ACCESS_TOKEN for publisher koo-ai"
            exit 1
          fi
          comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
      - name: Report publication failure
        if: failure()
        run: echo '::error::Release failed. Inspect the failed step; do not retry uploads until Registry history is checked.'
